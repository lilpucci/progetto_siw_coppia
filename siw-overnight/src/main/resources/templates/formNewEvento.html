<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuovo Evento</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>
<body>
    <div class="logo-container">
        <a href="/"><img src="/images/logo-siwfood.png" class="logo" /></a>
    </div>
    
    <div class="wrapper">
        <h1>Aggiungi un Nuovo Evento</h1>
        
        <form th:action="@{/admin/newEvento}" enctype="multipart/form-data" th:object="${evento}" method="post">
            <div class="message" th:if="${messaggioErrore != null}">
                <span th:text="${messaggioErrore}">Errore</span>
            </div>
            
            <div class="form-group">
                <label for="titoloEvento">Titolo Evento:</label>
                <input type="text" id="titoloEvento" th:field="*{titoloEvento}" required />
            </div>

            <div class="form-group">
                <label for="descr">Descrizione:</label>
                <input type="text" id="descr" th:field="*{descr}" required />
            </div>
            
            <div class="form-group">
                <label for="prezzo">Prezzo:</label>
                <input type="number" id="prezzo" th:field="*{prezzo}" step="0.01" required />
            </div>
            
            <div class="form-group">
                <label for="dataEvento">Data Evento:</label>
                <input type="date" id="dataEvento" th:field="*{dataEvento}" required />
            </div>

            <div class="form-group">
                <label for="locale">Locale:</label>
                <select id="locale" th:field="*{locale.id}" required>
                    <option th:each="locale : ${locali}" th:value="${locale.id}" th:text="${locale.nomeLocale}">Seleziona un locale</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="artisti">Artisti:</label>
                <select id="artisti" th:field="*{artisti}" multiple required>
                    <option th:each="artista : ${artisti}" th:value="${artista.id}" th:text="${artista.nome} + ' ' + ${artista.cognome}">Seleziona artisti</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="immagini">Immagini:</label>
                <input type="file" id="immagini" name="immagini" accept="image/*" multiple />
            </div>
            
            <div class="form-group">
                <button type="submit">Conferma</button>
            </div>
        </form>
        
        <div class="navigation">
            <a th:href="@{/eventi}">Torna alla lista degli eventi</a>    
        </div>
    </div>
</body>
</html>
