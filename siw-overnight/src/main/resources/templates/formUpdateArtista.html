<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiorna Artista</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>
<body>
    <div><a href="/"><img src="/images/logo-siwovernight.png" width="50%" /></a></div>

    <h1>Aggiorna Artista</h1>
    <form th:action="@{/admin/updateArtista/{id}(id=${artista.id})}" method="post" th:object="${artista}">
        <div>
			<label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" required>
		</div>
        <div>
			<label for="nome">Cognome:</label>
            <input type="text" id="cognome" th:field="*{cognome}" required>
		</div>
		<div>
			<label for="dataNascita">Data di Nascita:</label>
            <input type="date" id="dataNascita" th:field="*{data_nascita}" required>
		</div>
		<div>
			<label for="immagine">Immagine:</label>
            <input type="file" id="immagine" name="immagine" accept="image/*" required>
		</div>
		<div> <button type="submit">Aggiorna artista</button>
    </form>
    <div>
        <a th:href="@{/artisti/{id}}">torna ai dettagli dell' artista</a>    
    </div>
</body>
</html>
