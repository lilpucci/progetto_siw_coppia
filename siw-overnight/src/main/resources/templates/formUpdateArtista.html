<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiorna Artista</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>
<body>
    <div class="logo-container">
        <a href="/"><img src="/images/logo-siwovernight.png" class="logo" alt="Logo SiwOvernight"/></a>
    </div>

    <div class="wrapper">
        <h1>Aggiorna Artista</h1>
        <form th:action="@{/admin/editArtista/{id}(id=${artista.id})}" method="post" th:object="${artista}" enctype="multipart/form-data">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" th:field="*{nome}" required>
            </div>
            <div class="form-group">
                <label for="dataNascita">Data di Nascita:</label>
                <input type="date" id="dataNascita" th:field="*{dataNascita}" required>
            </div>
            <div class="form-group">
                <label for="immagine">Immagine:</label>
                <input type="file" id="immagine" name="immagine" accept="image/*" required multiple>
            </div>
            <div class="form-group">
                <button type="submit">Aggiorna artista</button>
            </div>
        </form>
        <div class="navigation">
            <a th:href="@{/artisti/{id}(id=${artista.id})}">Torna ai dettagli dell'artista</a>
        </div>
    </div>
</body>
</html>
