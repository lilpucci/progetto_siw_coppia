<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locale Details</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
    <div class="logo-container">
        <a href="/"><img class="logo" src="/images/logo-siwovernight.png" alt="Logo SiwOvernight" /></a>
    </div>

    <div class="wrapper" th:object="${locale}">
        <h1>Dettagli del Locale</h1>

        <div th:if="${locale.hasImmagini()}">
            <img th:src="'data:image/jpeg;base64,' + ${locale.getFirstImmagine().getBase64()}" alt="Immagine locale" class="locale-image" />
        </div>

        <!-- ATTRIBUTI DEL LOCALE -->
        <div>
            <h2 th:text="${locale.nomeLocale}">Nome Locale</h2>
            <p th:text="'Indirizzo: ' + ${locale.indirizzo}">indirizzo</p>
            <p th:text="'Descrizione: ' + ${locale.descrizione}">descrizione</p>
        </div>

        <!-- Eventi che si terranno presso il locale -->
        <div>
            <h3>Prossimamente</h3>
            <div th:if="${#lists.isEmpty(locale.eventi)}">
                <p>Non ci sono attualmente eventi in programma</p>
            </div>
            <!-- Se ci sono eventi, mostro il titolo (si potrebbe far diventare un ancora) -->
            <ul th:unless="${#lists.isEmpty(locale.eventi)}">
                <li th:each="evento : ${locale.eventi}">
                    <a th:href="@{/eventi/{id}(id=${evento.id})}">
                        <span th:text="${evento.titoloEvento}"></span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- Controllo se l'utente è loggato e se è admin -->
        <div th:if="${userDetails}">
            <div>
                <a th:href="@{/admin/newEvento/{id}(id=${locale.id})}">Aggiungi un evento al Locale</a>
            </div>
            <div>
                <a th:href="@{/admin/deleteLocale/{id}(id=${locale.id})}">Elimina questo Locale</a>
            </div>
        </div>

        <!-- Messaggio per l'utente non loggato -->
        <div th:unless="${userDetails}">
            <h3>Loggati per avere accesso alle operazioni</h3>
        </div>

        <!-- Link per tornare alla lista dei locali -->
        <div class="navigation">
            <a th:href="@{/locali}">Torna alla lista dei locali</a>
        </div>
    </div>
</body>

</html>
