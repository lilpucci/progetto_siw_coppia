<!DOCTYPE html>
<html>
<head>
    <title>New Artista</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>
<body>
    <div class="logo-container">
        <!--<a href="/"><img src="/images/logo-siwovernight.png" class="logo" alt="Logo SiwOvernight"/></a>-->
    </div>
    <div class="wrapper">
        <h1>Aggiungi un artista</h1>
        <form action="/admin/newArtista" method="post" enctype="multipart/form-data" th:object="${artista}">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" th:field="*{nome}" required>
            </div>
            <div class="form-group">
                <label for="dataNascita">Data di Nascita:</label>
                <input type="date" id="dataNascita" th:field="*{dataNascita}" required>
            </div>
            <div class="form-group">
                <label for="immagine">Immagine:</label>
                <input type="file" id="immagine" name="immagine" accept="image/*" required>
            </div>
            <div class="form-group">
                <span><button type="submit">Conferma</button></span>
            </div>
        </form>
        <div class="navigation">
            <a th:href="@{/artisti}">Torna alla lista degli artisti</a>
        </div>
    </div>
</body>
</html>
